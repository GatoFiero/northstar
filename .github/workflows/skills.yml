name: Check Northstar skills

on: [push, pull_request]

permissions:
  contents: read

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: node scripts/sync-skills.cjs --check
      - run: node --test scripts/sync-skills.test.cjs
      - name: Install the Codex CLI for the discovery check
        run: npm install --global --ignore-scripts @openai/codex@0.169.0
      - name: Load repository skills and install the plugin in an unrelated project
        run: node scripts/check-codex.cjs
